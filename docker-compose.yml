services:
  neo4j:
    image: neo4j:2026.08.1
    container_name: gaia-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/gaia-dev
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 4G
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
    name: gaia-neo4j-data
